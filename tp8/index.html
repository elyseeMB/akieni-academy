<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Calendar</title>
    <meta
      name="description"
      content="Découvrez les sorties de films tout au long de l’année grâce à un agenda cinéma simple et intuitif."
    >
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/index.css">
  </head>

  <body>
    <main>
      <header class="header-action">
        <div class="calendar-action">
          <div class="toolbar">
            <div class="toolbar-left">
              <search-component>
                <button class="btn" on:click="/open" aria-haspopup="dialog">
                  Recherchez un film...
                  <svg
                    class="icon icon-search"
                    aria-hidden="true"
                    role="graphics-symbol"
                    viewBox="0 0 20 20"
                  >
                    <path
                      d="M8.875 2.625a6.25 6.25 0 1 0 3.955 11.09l3.983 3.982a.625.625 0 1 0 .884-.884l-3.983-3.982a6.25 6.25 0 0 0-4.84-10.205m-5 6.25a5 5 0 1 1 10 0 5 5 0 0 1-10 0"
                    ></path>
                  </svg>
                </button>
                <dialog class="dialog-search" ref="dialog"></dialog>
              </search-component>
            </div>
            <div class="toolbar-right">
              <button
                on:click="#calendar-movies/scrollToToday"
                class="toolbar-right__today"
              >
                Aujourd'hui
              </button>
            </div>
          </div>
          <div class="calendar__current-month"></div>
        </div>
      </header>
      <head-calendar></head-calendar>
      <calendar-movies
        id="calendar-movies"
        class="calendar-main"
      ></calendar-movies>
      <layout-mobile id="layout-mobile" class="layout-mobile"></layout-mobile>
      <movie-popover id="movie-popover"></movie-popover>
      <movie-dialog>
        <dialog ref="dialog" class="calendar__day-dialog"></dialog>
      </movie-dialog>
    </main>
    <script type="module" src="index.js" defer></script>
  </body>
</html>
