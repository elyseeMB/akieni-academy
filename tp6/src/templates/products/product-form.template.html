<template data-name="product-form">
  <quick-add-component
    class="quick-add"
    data-quick-add-button="choose"
    data-product-options-count="1"
    data-attr-data-product-title="title"
  >
    <button
      class="button quick-add__button quick-add__button--choose add-to-cart-button"
      type="button"
      name="add"
      on:click="quick-add-component/handleClick"
      aria-label="Quick add"
    >
      <div class="quick-add__button-wrapper">
        <span class="add-to-cart-text quick-add__button-content">
          <span
            aria-hidden="true"
            class="svg-wrapper svg-wrapper--small add-to-cart-icon quick-add__button-icon"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="none"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="var(--icon-stroke-width)"
                d="M16.608 9.421V6.906H3.392v8.016c0 .567.224 1.112.624 1.513.4.402.941.627 1.506.627H8.63M8.818 3h2.333c.618 0 1.212.247 1.649.686a2.35 2.35 0 0 1 .683 1.658v1.562H6.486V5.344c0-.622.246-1.218.683-1.658A2.33 2.33 0 0 1 8.82 3"
              ></path>
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="var(--icon-stroke-width)"
                d="M14.608 12.563v5m2.5-2.5h-5"
              ></path>
            </svg></span
          >
<span
  class="add-to-cart-text__content quick-add__button-text"
>
  Choose
</span>
        </span>
      </div>
    </button>
  </quick-add-component>
</template>
