<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous produits | SUMMER BREAK SHOP</title>
    <link rel="stylesheet" href="css/index.css">
  </head>

  <body>
    <header class="header-section" role="banner">
      <header-component
        id="header-component"
        class="header"
        sticky="always"
        data-sticky-state="inactive"
      >
        <h1 class="visually-hidden">Roberto Collina</h1>
        <div class="header__row header__row--top" ref="headerRowTop">
          <div class="header__columns">
            <div class="header__column header__column--left">
              <div class="header-logo" aria-label="Vai alla Home">
               SUMMER BREAK SHOP
              </div>

              <header-menu
                ref="headerMenu"
                class="header-menu"
                data-animation-delay="200"
                style="--submenu-animation-speed: 200ms;"
              >
                <div class="header-menu__inner">
                  <nav header-menu>
                    <div class="menu-list">
                      <overflow-list
                        ref="overflowMenu"
                        class="overflow-menu"
                        minimum-items="2"
                      >
                        <template shadowrootmode="open">
                          <link
                            href="./css/components/overlist.css"
                            rel="stylesheet"
                            type="text/css"
                            media="all"
                          >

                          <ul part="list">
                            <slot></slot>
                            <slot name="more" part="more" hidden>
                              <li part="more">
                                <button
                                  class="button"
                                  type="button"
                                  tabindex="0"
                                ></button>
                              </li>
                            </slot>
                            <li part="placeholder" hidden></li>
                          </ul>

                          <div part="overflow">
                            <ul part="overflow-list">
                              <slot name="overflow"></slot>
                            </ul>
                          </div>
                        </template>
                      </overflow-list>
                    </div>
                  </nav>
                </div>
              </header-menu>
            </div>

            <div class="header__column header__column--right">
              <div class="header-action">
                <cart-drawer-component id="cart-drawer">
                  <button
                    class="header-actions__cart-icon button-unstyled"
                    type="button"
                    on:click="#cart-drawer/showDialog"
                    aria-label="Ouvrir le panier"
                  >
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 20 20"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M16.0586 5.5L17.4336 16.5H2.56641L3.94141 5.5H16.0586Z"
                        stroke="black"
                      ></path>
                      <path
                        d="M10 2.5C11.7632 2.5 13.2212 3.8039 13.4639 5.5H6.53613C6.77879 3.8039 8.2368 2.5 10 2.5Z"
                        stroke="black"
                      ></path>
                    </svg>
                    Panier <span id="cart-count" class="cart-count"></span>
                  </button>
                  <dialog ref="dialog" class="cart-drawer">
                    <div class="cart-drawer__header">
                      <h2>Panier</h2>
                      <button
                        class="cart-drawer__close button-unstyled"
                        type="button"
                        on:click="#cart-drawer/closeDialog"
                        aria-label="Fermer"
                      >
                        ×
                      </button>
                    </div>
                    <div class="cart-drawer__items" ref="items"></div>
                    <div class="cart-drawer__footer">
                      <button
                        class="button cart__checkout-button button"
                        type="button"
                        on:click="cart-drawer-component/checkout"
                      >
                        <span> Commander </span>
                        <span class="cart-drawer__total">
                          Total : <span ref="total">0</span>
                        </span>
                      </button>
                    </div>
                  </dialog>
                </cart-drawer-component>
              </div>
            </div>
          </div>
        </div>
      </header-component>
    </header>

    <main>
      <aside class="category-nav" aria-label="Catégories">
        <category-nav-component id="category-nav"></category-nav-component>
        <div class="column-options-wrapper">
            <div class="column-options">
              <legend class="column-options__legend">View</legend>
              <label class="column-options__option">
                <input
                  type="radio"
                  name="grid"
                  value="default"
                  class="column-options__option-input"
                  checked=""
                  aria-label="Default"
                  data-grid-layout="desktop-default-option"
                  on:change="#results-list/updateLayout"
                  data-skip-node-update=""
                >
                <span class="column-picker column-picker--default">1</span>
              </label>
              <label class="column-options__option">
                <input
                  type="radio"
                  name="grid"
                  value="zoom-out"
                  class="column-options__option-input"
                  aria-label="Zoom out"
                  on:change="#results-list/updateLayout"
                  data-skip-node-update=""
                >
                <span class="column-picker column-picker--zoom-out">2</span>
              </label>
              <label class="column-options__option">
                <input
                  type="radio"
                  name="grid"
                  value="organic"
                  class="column-options__option-input"
                  aria-label="Editorial"
                  on:change="#results-list/updateLayout"
                  data-skip-node-update=""
                >
                <span class="column-picker column-picker--organic">3</span>
              </label>
            </div>
          </div>
        </div>
      </aside>

      <results-list
        id="results-list"
        class="results-list product-grid-container"
        api-endpoint="https://withered-breeze-4769.mboussaemmanuelito.workers.dev/api/v1/products"
      >
        <category-title-component></category-title-component>
        <div class="collection-wrapper grid">
          <div
            id="ResultsList"
            class="grid main-collection-grid"
            style="--grid--margin--mobile: 0 0;
          --grid-column--desktop: var(--full-width);
          --grid-column--mobile: var(--full-width);"
          >
            <div
              style="grid-column: var(--full-width);
          --product-grid-gap-mobile: 32px 4px;
          --product-grid-gap-desktop: 48px 8px;
          container-type: inline-size;
          container-name: product-grid;"
            >
              <ul
                class="product-grid product-grid--grid"
                product-grid-view="default"
                ref="grid"
                role="list"
              ></ul>
            </div>
          </div>
        </div>
      </results-list>
    </main>

    <script type="module" src="index.js" defer></script>
  </body>
</html>
