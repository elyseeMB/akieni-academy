<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
  </head>

  <body>
    <header class="header-section" role="banner">
      <header-component
        id="header-component"
        class="header"
        sticky="always"
        data-sticky-state="inactive"
      >
        <h1 class="visually-hidden">Roberto Collina</h1>
        <div class="header__row header__row--top" ref="headerRowTop">
          <div class="header__columns">
            <div class="header__column header__column--left">
              <div class="header-logo" aria-label="Vai alla Home">
                <img
                  src="//www.robertocollina.it/cdn/shop/files/logo.png?height=100&amp;v=1770205056"
                  alt=""
                  width="1250"
                  height="100"
                  class="header-logo__image"
                >
              </div>

              <header-menu
                ref="headerMenu"
                class="header-menu"
                data-animation-delay="200"
                style="--submenu-animation-speed: 200ms;"
              >
                <div class="header-menu__inner">
                  <nav header-menu>
                    <div class="menu-list">
                      <overflow-list
                        ref="overflowMenu"
                        class="overflow-menu"
                        minimum-items="2"
                      >
                        <template shadowrootmode="open">
                          <link
                            href="./css/components/overlist.css"
                            rel="stylesheet"
                            type="text/css"
                            media="all"
                          >

                          <ul part="list">
                            <slot></slot>
                            <slot name="more" part="more" hidden>
                              <li part="more">
                                <button
                                  class="button"
                                  type="button"
                                  tabindex="0"
                                ></button>
                              </li>
                            </slot>
                            <li part="placeholder" hidden></li>
                          </ul>

                          <div part="overflow">
                            <ul part="overflow-list">
                              <slot name="overflow"></slot>
                            </ul>
                          </div>
                        </template>
                      </overflow-list>
                    </div>
                  </nav>
                </div>
              </header-menu>
            </div>

            <div
              class="header__column header__column--right"
              data-testid="header-top-right"
            ></div>
          </div>
        </div>
      </header-component>
    </header>

    <main></main>
  </body>

  <script>
  // Inline header height calculation to prevent layout shift
  // Note: calculateHeaderGroupHeight() and updateTransparentHeaderOffset() in
  // utilities.js should be kept in sync with this function
  (function setHeaderHeighCustomProperties() {
    /*
     * Header calculation functions for maintaining CSS variables
     * Mimic calculateHeaderGroupHeight() in utilities.js
     */
    const header = document.querySelector("header-component");
    const headerGroup = document.querySelector("#header-group");
    const hasHeaderSection = headerGroup?.querySelector(".header-section");

    if (!header || !headerGroup) return;

    const headerHeight = header.offsetHeight;

    // Calculate the total height of the header group
    let headerGroupHeight = 0;
    const children = headerGroup.children;

    for (let i = 0; i < children.length; i++) {
      const element = children[i];
      if (element === header || !(element instanceof HTMLElement)) continue;
      headerGroupHeight += element.offsetHeight;
    }

    // Check for transparent header special case
    if (
      header.hasAttribute("transparent") &&
      header.parentElement?.nextElementSibling
    ) {
      headerGroupHeight += headerHeight;
    }

    // Set CSS variables
    document.body.style.setProperty("--header-height", `${headerHeight}px`);
    document.body.style.setProperty(
      "--header-group-height",
      `${headerGroupHeight}px`,
    );

    /**
     * Updates CSS custom properties for transparent header offset calculation
     * Mimic updateTransparentHeaderOffset() in utilities.js
     */
    if (!hasHeaderSection || !header?.hasAttribute("transparent")) {
      document.body.style.setProperty(
        "--transparent-header-offset-boolean",
        "0",
      );
      return;
    }

    const hasImmediateSection =
      hasHeaderSection.nextElementSibling?.classList.contains(
        "shopify-section",
      );
    const shouldApplyOffset = !hasImmediateSection ? "1" : "0";

    document.body.style.setProperty(
      "--transparent-header-offset-boolean",
      shouldApplyOffset,
    );
  })();
  </script>

  <script type="module" src="index.js" defer></script>
</html>
